services:
  api:
    image: ghcr.io/tsag0005/normgraph-public-api:${NORMGRAPH_TAG:-latest}
    restart: unless-stopped
    environment:
      PIPELINE_UI_HOST: 0.0.0.0
      PORT: 8765
      PIPELINE_UI_SCRATCH: /tmp/normgraph-visitors
      ONTOGPT: /app/.venv-ontogpt/bin/ontogpt
    tmpfs:
      - /tmp/normgraph-visitors:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
  web:
    image: ghcr.io/tsag0005/normgraph-public-web:${NORMGRAPH_TAG:-latest}
    depends_on:
      - api
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
