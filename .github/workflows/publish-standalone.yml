name: Publish single-image edition

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/tsag0005/normgraph-public

jobs:
  build:
    name: Build standalone for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: standalone
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ matrix.arch }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish multi-platform single image
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release manifest
        shell: bash
        run: |
          set -euo pipefail
          tags=(-t "${IMAGE}:latest" -t "${IMAGE}:sha-${GITHUB_SHA::12}")
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tags+=(-t "${IMAGE}:${GITHUB_REF_NAME}")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "${IMAGE}:amd64-${GITHUB_SHA}" \
            "${IMAGE}:arm64-${GITHUB_SHA}"

  smoke:
    name: Start published image and check site
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run and check API and website
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name normgraph -p 127.0.0.1:18080:80 \
            --tmpfs /tmp/normgraph-visitors:size=1g,mode=1777 \
            "${IMAGE}:sha-${GITHUB_SHA::12}"
          for attempt in $(seq 1 90); do
            if curl -fs http://127.0.0.1:18080/api/status -o status.json && \
               curl -fs http://127.0.0.1:18080/ -o index.html; then
              python3 -c 'import json; assert json.load(open("status.json"))["api"] == "ready"'
              grep -q '<div id="root"' index.html
              curl -fs http://127.0.0.1:18080/policies/github_privacy_2017.md -o policy-2017.md
              curl -fs http://127.0.0.1:18080/policies/github_privacy_2018.md -o policy-2018.md
              grep -q 'October 11, 2017' policy-2017.md
              grep -q 'May 25, 2018' policy-2018.md
              docker exec normgraph sh -c 'test -s /app/pipeline/corpora/GDPR_article13_demo.txt && test -s /app/seed_graphs/gdpr_article13_demo/nodes.csv && test -s /app/seed_graphs/gdpr_article13_demo/edges.csv'
              python3 deploy/smoke_published.py
              exit 0
            fi
            sleep 2
          done
          docker logs normgraph
          exit 1
      - name: Container logs on failure
        if: failure()
        run: docker logs normgraph || true
      - name: Remove smoke container
        if: always()
        run: docker rm -f normgraph || true
