name: Publish container images

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_PREFIX: ghcr.io/tsag0005/normgraph-public

jobs:
  build:
    name: Build ${{ matrix.target }} for ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: api
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - target: api
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - target: web
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - target: web
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ matrix.target }}
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.target }}:${{ matrix.arch }}-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  publish:
    name: Publish multi-platform tags
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create release manifests
        shell: bash
        run: |
          set -euo pipefail
          for target in api web; do
            image="${IMAGE_PREFIX}-${target}"
            tags=(-t "${image}:latest" -t "${image}:sha-${GITHUB_SHA::12}")
            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              tags+=(-t "${image}:${GITHUB_REF_NAME}")
            fi
            docker buildx imagetools create "${tags[@]}" \
              "${image}:amd64-${GITHUB_SHA}" \
              "${image}:arm64-${GITHUB_SHA}"
          done
