# Which corpus owns which Neo4j node prefix.
#
# Written by graph_registry.claim(), read before any graph load. Several corpora
# share one Aura instance and Neo4j has no namespaces, so two corpora claiming one
# prefix would merge into a single graph with no error reported anywhere.
corpora:
  app_schedule1:
    claimed: '2026-09-08'
    description: Schedule 1 of the Privacy Act 1988 (Cth) — the Australian Privacy
      Principles
    node_prefix: SP_
  part_iiic:
    claimed: '2026-09-09'
    description: Part IIIC of the Privacy Act 1988 (Cth) - notification of eligible
      data breaches
    node_prefix: PI_
