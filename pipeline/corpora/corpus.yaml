# Which piece of legislation this checkout is configured for.
#
# Every path, filename prefix, node-label prefix and provision pattern that used to be
# hard-coded to the Australian Privacy Principles is read from here instead. Generated by
# `induce_structure.py --write-config` from the structural profile named below; nothing in
# it has to be reasoned out by hand. Segmentation and cross-reference parsing are driven
# by that profile too, so pointing the pipeline at a different instrument no longer means
# writing code. See PIPELINE_RUNBOOK.md section 0.
#
# The values below reproduce the previous hard-coded behaviour exactly. Changing them
# changes where files are read and written and what the graph is labelled, so a change
# here without a matching rebuild will silently read the wrong corpus.
#
# This file describes the CORPUS ONLY. Paths that exist to measure the pipeline's output
# -- the element decomposition, the manual test cases, the policies judged against --
# live in evaluation/eval_config.yaml and are never read from here.

name: app_schedule1
description: Schedule 1 of the Privacy Act 1988 (Cth) — the Australian Privacy Principles

# Filename prefix for per-provision artefacts: app_6_1.txt, app_6_1.yaml, and the
# app_*.yaml globs that collect them.
file_prefix: app

# Neo4j label and relationship-type prefix for the SPIRES norm graph. Several corpora
# can share one Aura instance as long as their prefixes differ -- :AppNode, :RP1Entity
# and :SP_* already coexist in ours.
node_prefix: SP_

paths:
  # The statute as downloaded, one line per structural element.
  raw: corpora/APPschedule1.txt
  # Root of the SPIRES extraction pipeline: schema, input/, output/, graph/.
  spires_dir: spires
  # The structural profile: an ordered list of line classifiers saying how this
  # instrument lays itself out, which level is the provision, and how an identifier is
  # composed. Produced and validated by induce_structure.py, consumed by prep_corpus.py.
  # Hand-editable -- correcting one pattern is cheaper than re-inducing.
  profile: profiles/app_schedule1.yaml
  # The LinkML schema SPIRES extracts against. Instrument-neutral, so corpora share it.
  schema: spires/norm.yaml

# Readings the modality grammar gets wrong, as provision id -> {norm index: modality}.
# The cleaner labels "This <unit> applies ..." provisions APPLICABILITY, which matched 23
# of 23 such norms in Schedule 1 with one collision: 6.6 says the principle "applies AS IF
# the entity's primary purpose ...", which modifies another provision rather than gating
# an exception. Corpus-specific by nature, which is why it is here and not in the cleaner.
modality_overrides:
  "6.6":
    1: NONE

# Strings block 1 of the prompt renders. They teach the model what a privacy policy
# will never say, and the only way to teach that is with examples from the instrument at
# hand -- so they are corpus-specific by nature. The defaults reproduce the wording the
# recorded results were generated with, character for character.
prompt:
  # The embedded newline and three-space indent are deliberate: this value is substituted
  # into a hand-wrapped paragraph, and a single-line value re-flows the line it lands in.
  # The 117 recorded prompts are byte-compared in tests, and that is how it was caught.
  citation_examples: "\"Australian Privacy Principle 6\", \"subclause 6.2\", \"the\n   Privacy Act\" or \"as required by Australian law\""
  example_provision: subclause 6.2
  provision_plural: Australian subclauses

provision:
  # Finds the provision identifier inside a piece of text. This is the single most
  # instrument-specific value in the file: 'N.M' suits the APPs, but another statute may
  # number clauses 's 12(3)(a)' or 'Art. 6(1)(b)' and will need a different pattern.
  pattern: '\b(?:subclause\s+)?(\d{1,2}\.\d{1,2})\b'
  # How a provision id becomes a graph key: "6.1" -> "subclause 6.1". Set to an empty
  # string for a corpus whose identifiers are already self-describing.
  key_prefix: subclause
