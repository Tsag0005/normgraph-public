name: notification_of_eligible_data_breaches
description: Part IIIC of the Privacy Act 1988 (Cth)
levels:
- name: part
  role: heading
  pattern: ^Part\s+([IVXLCDM]+[A-Z]*)\s+-\s+(.+)$
- name: division
  role: heading
  pattern: ^Division\s+(\d+)\s+-\s+(.+)$
- name: section
  role: container
  pattern: ^(\d{2}[A-Z]{1,3})\s+(.+)$
- name: subsection
  role: provision
  pattern: ^\((\d+)\)\s+(.+)$
- name: paragraph
  role: body
  pattern: ^\((a|b|c|d|e|f|g|h)\)\s+(.+)$
- name: subparagraph
  role: body
  pattern: ^\((i|ii|iii|iv|v|vi|vii|viii|ix|x)\)\s+(.+)$
