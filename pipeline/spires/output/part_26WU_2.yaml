input_text: |
  26WU(2) (2) Without limiting subsection (1), the relevant matters may relate to one or more of the following: (a) whether the entity is required to comply with one or more of those requirements; (b) the conduct or events that led to, or may have led to, the application of one or more of those requirements to the entity; (c) the actions taken by the entity to comply with one or more of those requirements; (d) the actual or suspected eligible data breach that has, or may have, happened; (e) the particular kind or kinds of information involved in the actual or suspected eligible data breach; (f) the steps taken to notify individuals affected by the actual or suspected eligible data breach.
raw_completion_output: |-
  provision_id: 26WU(2)  
  norms: The relevant matters may relate to whether the entity is required to comply with one or more of those requirements; The relevant matters may relate to the conduct or events that led to, or may have led to, the application of one or more of those requirements to the entity; The relevant matters may relate to the actions taken by the entity to comply with one or more of those requirements; The relevant matters may relate to the actual or suspected eligible data breach that has, or may have, happened; The relevant matters may relate to the particular kind or kinds of information involved in the actual or suspected eligible data breach; The relevant matters may relate to the steps taken to notify individuals affected by the actual or suspected eligible data breach.  
  disapplies:   
  cross_references: 
prompt: |+
  From the text below, extract the following entities in the following format:

  deontic_modality: <The normative force. "must" is an OBLIGATION; "must not" is a PROHIBITION; "may" or "is authorised to" is a PERMISSION. If the provision's own work is to switch another provision OFF -- it says some other provision "does not apply" -- then it is a DISAPPLICATION, whatever verbs appear in its limbs. If it merely states that other provisions apply, or is purely definitional, it is NONE.Must be one of: OBLIGATION, PROHIBITION, PERMISSION, DISAPPLICATION, APPLICABILITY, NONE>
  bearer: <The party on whom the norm falls -- the actor the provision names, such as "entity", "organisation" or "agency". Use the words the text uses.>
  action: <The regulated act, as a verb phrase, e.g. "use or disclose", "destroy", "de-identify", "deal with individuals who have identified themselves".>
  object: <What the action is performed on, e.g. "personal information", "sensitive information", "biometric information".>
  conditions: <The circumstances that must hold for this norm to apply at all, as a semicolon-separated list. These are triggers, not exceptions. A norm reading "if an entity holds information collected for a primary purpose, it must not use it for a secondary purpose" has both of those circumstances as conditions.>
  exceptions: <The circumstances that switch this norm OFF, as a semicolon-separated list. Anything introduced by "unless", "does not apply if" or "other than" is an exception, not a condition. If the text contains such a clause you MUST return an entry here -- a norm stating "must not X unless Y" always has Y as an exception.>
  scope_qualifier: <Any limit on the norm's reach, e.g. "in relation to that matter", "as soon as practicable", "within a reasonable period". Leave blank if unqualified.>


  Text:
  The relevant matters may relate to the steps taken to notify individuals affected by the actual or suspected eligible data breach.

  ===

