input_text: |
  26WS Exception - enforcement related activities An entity is not required to comply with a direction under subsection 26WR(1) if: (a) the entity is an enforcement body; and (b) the chief executive officer of the enforcement body believes on reasonable grounds that compliance with the direction would be likely to prejudice one or more enforcement related activities conducted by, or on behalf of, the enforcement body.
