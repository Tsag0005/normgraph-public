input_text: |
  26WC(1) (1) If: (a) an APP entity has disclosed personal information about one or more individuals to an overseas recipient; and (b) Australian Privacy Principle 8.1 applied to the disclosure of the personal information; and (c) the overseas recipient holds the personal information; this Part has effect as if: (d) the personal information were held by the APP entity; and (e) the APP entity were required under section 15 not to do an act, or engage in a practice, that breaches Australian Privacy Principle 11.1 in relation to the personal information. Bodies or persons with no Australian link
