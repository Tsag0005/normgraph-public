input_text: |
  26WE(1) (1) This section applies if: (a) both: (i) an APP entity holds personal information relating to one or more individuals; and (ii) the APP entity is required under section 15 not to do an act, or engage in a practice, that breaches Australian Privacy Principle 11.1 in relation to the personal information; or (b) both: (i) a credit reporting body holds credit reporting information relating to one or more individuals; and (ii) the credit reporting body is required to comply with section 20Q in relation to the credit reporting information; or (c) both: (i) a credit provider holds credit eligibility information relating to one or more individuals; and (ii) the credit provider is required to comply with subsection 21S(1) in relation to the credit eligibility information; or (d) both: (i) a file number recipient holds tax file number information relating to one or more individuals; and (ii) the file number recipient is required under section 18 not to do an act, or engage in a practice, that breaches a section 17 rule that relates to the tax file number information. Eligible data breach
raw_completion_output: |-
  provision_id: 26WE(1)  
  norms: This section applies if both an APP entity holds personal information relating to one or more individuals and the APP entity is required under section 15 not to do an act, or engage in a practice, that breaches Australian Privacy Principle 11.1 in relation to the personal information; This section applies if both a credit reporting body holds credit reporting information relating to one or more individuals and the credit reporting body is required to comply with section 20Q in relation to the credit reporting information; This section applies if both a credit provider holds credit eligibility information relating to one or more individuals and the credit provider is required to comply with subsection 21S(1) in relation to the credit eligibility information; This section applies if both a file number recipient holds tax file number information relating to one or more individuals and the file number recipient is required under section 18 not to do an act, or engage in a practice, that breaches a section 17 rule that relates to the tax file number information.  
  disapplies:   
  cross_references: section 15; Australian Privacy Principle 11.1; section 20Q; subsection 21S(1); section 18; section 17
