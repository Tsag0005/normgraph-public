input_text: |
  7.3 Despite subclause 7.1, an organisation may use or disclose personal information (other than sensitive information) about an individual for the purpose of direct marketing if: (a) the organisation collected the information from: (i) the individual and the individual would not reasonably expect the organisation to use or disclose the information for that purpose; or (ii) someone other than the individual; and (b) either: (i) the individual has consented to the use or disclosure of the information for that purpose; or (ii) it is impracticable to obtain that consent; and (c) the organisation provides a simple means by which the individual may easily request not to receive direct marketing communications from the organisation; and (d) in each direct marketing communication with the individual: (i) the organisation includes a prominent statement that the individual may make such a request; or (ii) the organisation otherwise draws the individual's attention to the fact that the individual may make such a request; and (e) the individual has not made such a request to the organisation. Exception - sensitive information
raw_completion_output: |-
  provision_id: 7.3  
  norms: Subclause 7.1 does not apply, and an organisation may use or disclose personal information (other than sensitive information) about an individual for the purpose of direct marketing if the organisation collected the information from the individual and the individual would not reasonably expect the organisation to use or disclose the information for that purpose; Subclause 7.1 does not apply, and an organisation may use or disclose personal information (other than sensitive information) about an individual for the purpose of direct marketing if the organisation collected the information from someone other than the individual; Subclause 7.1 does not apply, and an organisation may use or disclose personal information (other than sensitive information) about an individual for the purpose of direct marketing if the individual has consented to the use or disclosure of the information for that purpose; Subclause 7.1 does not apply, and an organisation may use or disclose personal information (other than sensitive information) about an individual for the purpose of direct marketing if it is impracticable to obtain the individual's consent; Subclause 7.1 does not apply, and an organisation may use or disclose personal information (other than sensitive information) about an individual for the purpose of direct marketing if the organisation provides a simple means by which the individual may easily request not to receive direct marketing communications from the organisation; Subclause 7.1 does not apply, and an organisation may use or disclose personal information (other than sensitive information) about an individual for the purpose of direct marketing, and in each direct marketing communication with the individual, the organisation includes a prominent statement that the individual may request not to receive such communications; Subclause 7.1 does not apply, and an organisation may use or disclose personal information (other than sensitive information) about an individual for the purpose of direct marketing and in each direct marketing communication with the individual, the organisation otherwise draws the individual's attention to the fact that the individual may make such a request; Subclause 7.1 does not apply, and an organisation may use or disclose personal information (other than sensitive information) about an individual for the purpose of direct marketing if the individual has not made such a request to the organisation.  
  disapplies: 7.1  
  cross_references:  
