input_text: |
  26WF(1) (1) If: (a) an access to, or disclosure of, information is covered by paragraph 26WE(2)(a); and (b) the APP entity, credit reporting body, credit provider or file number recipient, as the case may be, takes action in relation to the access or disclosure; and (c) the APP entity, credit reporting body, credit provider or file number recipient, as the case may be, does so before the access or disclosure results in serious harm to any of the individuals to whom the information relates; and (d) as a result of the action, a reasonable person would conclude that the access or disclosure would not be likely to result in serious harm to any of those individuals; the access or disclosure is not, and is taken never to have been: (e) an eligible data breach of the APP entity, credit reporting body, credit provider or file number recipient, as the case may be; or (f) an eligible data breach of any other entity.
raw_completion_output: |-
  provision_id: 26WF(1)  
  norms: Provision 26WF(1) determines that if an access to, or disclosure of, information is covered by paragraph 26WE(2)(a), and the APP entity, credit reporting body, credit provider or file number recipient takes action in relation to the access or disclosure before it results in serious harm to any individuals to whom the information relates, and as a result of the action, a reasonable person would conclude that the access or disclosure would not be likely to result in serious harm to any of those individuals, then the access or disclosure is not, and is taken never to have been, an eligible data breach of the APP entity, credit reporting body, credit provider or file number recipient; Provision 26WF(1) determines that if an access to, or disclosure of, information is covered by paragraph 26WE(2)(a), and the APP entity, credit reporting body, credit provider or file number recipient takes action in relation to the access or disclosure before it results in serious harm to any individuals to whom the information relates, and as a result of the action, a reasonable person would conclude that the access or disclosure would not be likely to result in serious harm to any of those individuals, then the access or disclosure is not, and is taken never to have been, an eligible data breach of any other entity.  
  disapplies:   
  cross_references: 26WE(2)(a)  
