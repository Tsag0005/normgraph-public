input_text: |
  26WF(2) (2) If: (a) an access to, or disclosure of, information is covered by paragraph 26WE(2)(a); and (b) the APP entity, credit reporting body, credit provider or file number recipient, as the case may be, takes action in relation to the access or disclosure; and (c) the APP entity, credit reporting body, credit provider or file number recipient, as the case may be, does so before the access or disclosure results in serious harm to a particular individual to whom the information relates; and (d) as a result of the action, a reasonable person would conclude that the access or disclosure would not be likely to result in serious harm to the individual; this Part does not require: (e) the APP entity, credit reporting body, credit provider or file number recipient, as the case may be; or (f) any other entity; to take steps to notify the individual of the contents of a statement that relates to the access or disclosure. Loss of information
