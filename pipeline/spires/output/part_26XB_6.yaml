input_text: |
  26XB(6) (6) In this section: designated secrecy provision means any of the following: (a) sections 18, 18A, 18B, 34GF, 35P, 92 and 92A, and subsection 34GE(4), of the Australian Security Intelligence Organisation Act 1979; (b) section 15LC of the Crimes Act 1914; (c) section 34 of the Inspector-General of Intelligence and Security Act 1986; (d) sections 39, 40C, 40D and 41 of, and clause 9 of Schedule 1 to, the Intelligence Services Act 2001; (e) sections 42 and 44 of the Office of National Intelligence Act 2018; (f) sections 22, 22A and 22B of the Witness Protection Act 1994; (g) a provision of a Commonwealth law prescribed by the regulations for the purposes of this paragraph; (h) a provision of a Commonwealth law of a kind prescribed by the regulations for the purposes of this paragraph. secrecy provision means a provision of a Commonwealth law (including a provision of this Act) that prohibits or regulates the use or disclosure of personal information, whether the provision relates to the use or disclosure of personal information generally or in specified circumstances.
