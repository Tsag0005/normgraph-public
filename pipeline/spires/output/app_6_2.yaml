input_text: |
  6.2 This subclause applies in relation to the use or disclosure of personal information about an individual if: (a) the individual would reasonably expect the APP entity to use or disclose the information for the secondary purpose and the secondary purpose is: (i) if the information is sensitive information - directly related to the primary purpose; or (ii) if the information is not sensitive information - related to the primary purpose; or (b) the use or disclosure of the information is required or authorised by or under an Australian law or a court/tribunal order; or (c) a permitted general situation exists in relation to the use or disclosure of the information by the APP entity; or (d) the APP entity is an organisation and a permitted health situation exists in relation to the use or disclosure of the information by the entity; or (e) the APP entity reasonably believes that the use or disclosure of the information is reasonably necessary for one or more enforcement related activities conducted by, or on behalf of, an enforcement body. Note: For permitted general situation, see section 16A. For permitted health situation, see section 16B.
raw_completion_output: |-
  provision_id: 6.2  
  norms: This subclause applies in relation to the use or disclosure of personal information about an individual if the individual would reasonably expect the APP entity to use or disclose the information for the secondary purpose and the secondary purpose is directly related to the primary purpose if the information is sensitive information; This subclause applies in relation to the use or disclosure of personal information about an individual if the individual would reasonably expect the APP entity to use or disclose the information for the secondary purpose and the secondary purpose is related to the primary purpose if the information is not sensitive information; This subclause applies in relation to the use or disclosure of personal information about an individual if the use or disclosure of the information is required or authorised by or under an Australian law or a court/tribunal order; This subclause applies in relation to the use or disclosure of personal information about an individual if a permitted general situation exists in relation to the use or disclosure of the information by the APP entity; This subclause applies in relation to the use or disclosure of personal information about an individual if the APP entity is an organisation and a permitted health situation exists in relation to the use or disclosure of the information by the entity; This subclause applies in relation to the use or disclosure of personal information about an individual if the APP entity reasonably believes that the use or disclosure of the information is reasonably necessary for one or more enforcement-related activities conducted by, or on behalf of, an enforcement body.  
  disapplies:   
  cross_references: section 16A; section 16B; Australian Privacy Principle 3  
