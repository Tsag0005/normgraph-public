  provision_id: 26WU(1)(1)  
  norms: This section applies if the Commissioner has reason to believe that a person or entity has information or documents that are relevant to an actual or suspected eligible data breach of an entity; This section applies if the Commissioner has reason to believe that a person or entity can answer questions that are relevant to an actual or suspected eligible data breach of an entity; This section applies if the Commissioner has reason to believe that a person or entity has information or documents that are relevant to an entity's compliance with the requirements in Division 3 of this Part; This section applies if the Commissioner has reason to believe that a person or entity can answer questions that are relevant to an entity's compliance with the requirements in Division 3 of this Part.
  disapplies:  
  cross_references: Division 3
