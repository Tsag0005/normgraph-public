  26WU(1) (1) This section applies if the Commissioner has reason to believe that a person or entity has information or documents, or can answer questions, that are relevant to either or both of the following matters (the relevant matters): (a) an actual or suspected eligible data breach of an entity; (b) an entity's compliance with the requirements in Division 3 of this Part.
