input_text: |
  26WQ(9) (9) If an entity applies to the Commissioner under paragraph (5)(b) for a declaration that, to any extent, relates to an eligible data breach of the entity, sections 26WK and 26WL do not apply in relation to: (a) the eligible data breach; or (b) if the access, disclosure or loss that constituted the eligible data breach of the entity is an eligible data breach of one or more other entities - such an eligible data breach of those other entities; until the Commissioner makes a decision in response to the application for the declaration.
