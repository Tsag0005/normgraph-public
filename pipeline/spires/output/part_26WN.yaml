  26WN Exception - enforcement related activities If: (a) an entity is an enforcement body; and (b) the chief executive officer of the enforcement body believes on reasonable grounds that there has been an eligible data breach of the entity; and (c) the chief executive officer of the enforcement body believes on reasonable grounds that compliance with section 26WL in relation to the eligible data breach would be likely to prejudice one or more enforcement related activities conducted by, or on behalf of, the enforcement body; paragraph 26WK(3)(d) and section 26WL do not apply in relation to: (d) the eligible data breach of the entity; and (e) if the access, disclosure or loss that constituted the eligible data breach of the entity is an eligible data breach of one or more other entities - such an eligible data breach of those other entities.
