provision_id: 26WC(2)
norms:
- deontic_modality: NONE
  bearer: AUTO:credit%20provider
  action: AUTO:comply
  object: AUTO:subsection%2021S%281%29%20in%20relation%20to%20the%20credit%20eligibility%20information
  conditions:
  - statement: A credit provider has disclosed, under paragraph 21G(3)(b) or (c), credit eligibility information
      about one or more individuals to a related body corporate, or person, that does not have an Australian
      link.
    source_provision: 21G(3)(b) or (c)
  - statement: The related body corporate, body or person holds the credit eligibility information.
- deontic_modality: APPLICABILITY
  bearer: AUTO:This%20Part
  action: AUTO:has%20effect%20as%20if%20the%20credit%20eligibility%20information%20were%20held%20by%20the%20credit%20provider%20and%20the%20credit%20provider%20were%20required%20to%20comply%20with%20subsection%2021S%281%29
  object: AUTO:credit%20eligibility%20information
  conditions:
  - statement: A credit provider has disclosed, under subsection 21M(1), credit eligibility information
      about one or more individuals to a body or person that does not have an Australian link.
    source_provision: 21M(1)
  - statement: the body or person holds the credit eligibility information
cross_references:
- 21G(3)(b), 21G(3)(c), 21M(1), 21S(1), 21NA
