input_text: |
  26WL(2) (2) The entity must: (a) if it is practicable for the entity to notify the contents of the statement to each of the individuals to whom the relevant information relates - take such steps as are reasonable in the circumstances to notify the contents of the statement to each of the individuals to whom the relevant information relates; or (b) if it is practicable for the entity to notify the contents of the statement to each of the individuals who are at risk from the eligible data breach - take such steps as are reasonable in the circumstances to notify the contents of the statement to each of the individuals who are at risk from the eligible data breach; or (c) if neither paragraph (a) nor (b) applies: (i) publish a copy of the statement on the entity's website (if any); and (ii) take reasonable steps to publicise the contents of the statement. Note: See also subsections 26WF(2) and (5), which deal with remedial action.
raw_completion_output: |-
  provision_id: 26WL(2)

  norms: The entity must take such steps as are reasonable in the circumstances to notify the contents of the statement to each of the individuals to whom the relevant information relates if it is practicable for the entity to notify the contents of the statement to each of the individuals to whom the relevant information relates; The entity must take such steps as are reasonable in the circumstances to notify the contents of the statement to each of the individuals who are at risk from the eligible data breach if it is practicable for the entity to notify the contents of the statement to each of the individuals who are at risk from the eligible data breach; The entity must publish a copy of the statement on the entity's website (if any) and take reasonable steps to publicise the contents of the statement if neither paragraph (a) nor (b) applies.

  disapplies: 

  cross_references: 26WF(2); 26WF(5)
