provision_id: 26WL(2)
norms:
- deontic_modality: OBLIGATION
  bearer: AUTO:The%20entity
  action: AUTO:take%20such%20steps%20as%20are%20reasonable%20in%20the%20circumstances%20to%20notify%20the%20contents%20of%20the%20statement
  object: AUTO:each%20of%20the%20individuals%20to%20whom%20the%20relevant%20information%20relates
  conditions:
  - statement: It is practicable for the entity to notify the contents of the statement to each of the
      individuals to whom the relevant information relates.
- deontic_modality: OBLIGATION
  bearer: AUTO:The%20entity
  action: AUTO:notify%20the%20contents%20of%20the%20statement
  object: AUTO:each%20of%20the%20individuals%20who%20are%20at%20risk%20from%20the%20eligible%20data%20breach
  conditions:
  - statement: It is practicable for the entity to notify the contents of the statement to each of the
      individuals who are at risk from the eligible data breach.
- deontic_modality: OBLIGATION
  bearer: AUTO:The%20entity
  action: AUTO:take%20reasonable%20steps%20to%20publicise%20the%20contents%20of%20the%20statement
  object: AUTO:the%20entity%27s%20website
  conditions:
  - statement: neither paragraph (a) nor (b) applies
