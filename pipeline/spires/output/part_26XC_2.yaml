input_text: |
  26XC(2) (2) Subsection (1) does not apply to the following disclosures: (a) if the first person is an APP entity - a disclosure permitted under an Australian Privacy Principle, a registered APP code that binds the person or a rule issued under section 17 (rules relating to tax file number information); (b) a disclosure for the purposes of carrying out a State's constitutional functions, powers or duties; (c) a disclosure for the purposes of obtaining or providing legal advice in relation to the operation of this Division; (d) a disclosure permitted under section 26XB; (e) a disclosure made with the consent of the individual to whom the personal information relates; (f) a disclosure to the individual to whom the personal information relates; (g) a disclosure to a court; (h) a disclosure prescribed by the regulations. Note: A defendant bears an evidential burden in relation to a matter in this subsection (see subsection 13.3(3) of the Criminal Code).
