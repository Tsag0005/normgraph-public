use 5.1 are whether the APP entity is likely to disclose the personal information to overseas recipients; The matters for the purposes of subclause 5.1 are if the APP entity is likely to disclose the personal information to overseas recipients, the countries in which such recipients are likely to be located if it is practicable to specify those countries in the notification or to otherwise make the individual aware of them.  
