---
input_text: |
  26XB(1) (1) At any time when an eligible data breach declaration is in force in relation to an eligible data breach, an entity may collect, use or disclose personal information about an individual if: (a) the entity reasonably believes that the individual may be at risk from the eligible data breach; and (b) the collection, use or disclosure is for a permitted purpose specified in the declaration; and (c) the information is information of a kind or kinds specified in the declaration; and (d) the information is disclosed by an entity specified in the declaration, or an entity included in a class of entities specified in the declaration; and (e) the information is disclosed to an entity specified in the declaration, or an entity included in a class of entities specified in the declaration; and (f) if a matter mentioned in paragraph (b), (c), (d) or (e) is specified in the declaration subject to conditions - those conditions are satisfied.
raw_completion_output: |-
  provision_id: 26XB(1)
  norms: At any time when an eligible data breach declaration is in force in relation to an eligible data breach, an entity may collect, use or disclose personal information about an individual if the entity reasonably believes that the individual may be at risk from the eligible data breach; At any time when an eligible data breach declaration is in force in relation to an eligible data breach, an entity may collect, use or disclose personal information about an individual if the collection, use or disclosure is for a permitted purpose specified in the declaration; At any time when an eligible data breach declaration is in force in relation to an eligible data breach, an entity may collect, use or disclose personal information about an individual if the information is information of a kind or kinds specified in the declaration; At any time when an eligible data breach declaration is in force in relation to an eligible data breach, an entity may collect, use or disclose personal information about an individual if the information is disclosed by an entity specified in the declaration, or an entity included in a class of entities specified in the declaration; At any time when an eligible data breach declaration is in force in relation to an eligible data breach, an entity may collect, use or disclose personal information about an individual if the information is disclosed to an entity specified in the declaration, or an entity included in a class of entities specified in the declaration; At any time when an eligible data breach declaration is in force in relation to an eligible data breach, an entity may collect, use or disclose personal information about an individual if, if a matter mentioned in paragraph (b), (c), (d) or (e) is specified in the declaration subject to conditions, those conditions are satisfied.
