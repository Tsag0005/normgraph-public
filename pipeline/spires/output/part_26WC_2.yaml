input_text: |
  26WC(2) (2) If: (a) either: (i) a credit provider has disclosed, under paragraph 21G(3)(b) or (c), credit eligibility information about one or more individuals to a related body corporate, or person, that does not have an Australian link; or (ii) a credit provider has disclosed, under subsection 21M(1), credit eligibility information about one or more individuals to a body or person that does not have an Australian link; and (b) the related body corporate, body or person holds the credit eligibility information; this Part has effect as if: (c) the credit eligibility information were held by the credit provider; and (d) the credit provider were required to comply with subsection 21S(1) in relation to the credit eligibility information. Note: See section 21NA.
raw_completion_output: |-
  provision_id: 26WC(2)

  norms: If a credit provider has disclosed, under paragraph 21G(3)(b) or (c), credit eligibility information about one or more individuals to a related body corporate, or person, that does not have an Australian link, and the related body corporate, body or person holds the credit eligibility information, this Part has effect as if the credit eligibility information were held by the credit provider and the credit provider were required to comply with subsection 21S(1) in relation to the credit eligibility information; If a credit provider has disclosed, under subsection 21M(1), credit eligibility information about one or more individuals to a body or person that does not have an Australian link, and the body or person holds the credit eligibility information, this Part has effect as if the credit eligibility information were held by the credit provider and the credit provider were required to comply with subsection 21S(1) in relation to the credit eligibility information.

  disapplies: 

  cross_references: 21G(3)(b), 21G(3)(c), 21M(1), 21S(1), 21NA
