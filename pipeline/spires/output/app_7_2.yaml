input_text: |
  7.2 Despite subclause 7.1, an organisation may use or disclose personal information (other than sensitive information) about an individual for the purpose of direct marketing if: (a) the organisation collected the information from the individual; and (b) the individual would reasonably expect the organisation to use or disclose the information for that purpose; and (c) the organisation provides a simple means by which the individual may easily request not to receive direct marketing communications from the organisation; and (d) the individual has not made such a request to the organisation.
raw_completion_output: |-
  provision_id: 7.2  
  norms: Subclause 7.1 does not apply if an organisation collected the information from the individual; Subclause 7.1 does not apply if the individual would reasonably expect the organisation to use or disclose the information for the purpose of direct marketing; Subclause 7.1 does not apply if the organisation provides a simple means by which the individual may easily request not to receive direct marketing communications from the organisation; Subclause 7.1 does not apply if the individual has not made a request to the organisation not to receive direct marketing communications.  
  disapplies: 7.1  
  cross_references:  
