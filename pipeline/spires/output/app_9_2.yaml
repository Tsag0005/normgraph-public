input_text: |
  9.2 An organisation must not use or disclose a government related identifier of an individual unless: (a) the use or disclosure of the identifier is reasonably necessary for the organisation to verify the identity of the individual for the purposes of the organisation's activities or functions; or (b) the use or disclosure of the identifier is reasonably necessary for the organisation to fulfil its obligations to an agency or a State or Territory authority; or (c) the use or disclosure of the identifier is required or authorised by or under an Australian law or a court/tribunal order; or (d) a permitted general situation (other than the situation referred to in item 4 or 5 of the table in subsection 16A(1)) exists in relation to the use or disclosure of the identifier; or (e) the organisation reasonably believes that the use or disclosure of the identifier is reasonably necessary for one or more enforcement related activities conducted by, or on behalf of, an enforcement body; or (f) subclause 9.3 applies in relation to the use or disclosure. Note 1: An act or practice of an agency may be treated as an act or practice of an organisation, see section 7A. Note 2: For permitted general situation, see section 16A. Regulations about adoption, use or disclosure
raw_completion_output: |-
  provision_id: 9.2  
  norms: An organisation must not use or disclose a government related identifier of an individual; An organisation may use or disclose a government related identifier of an individual if the use or disclosure of the identifier is reasonably necessary for the organisation to verify the identity of the individual for the purposes of the organisation's activities or functions; An organisation may use or disclose a government related identifier of an individual if the use or disclosure of the identifier is reasonably necessary for the organisation to fulfil its obligations to an agency or a State or Territory authority; An organisation may use or disclose a government related identifier of an individual if the use or disclosure of the identifier is required or authorised by or under an Australian law or a court/tribunal order; An organisation may use or disclose a government related identifier of an individual if a permitted general situation (other than the situation referred to in item 4 or 5 of the table in subsection 16A(1)) exists in relation to the use or disclosure of the identifier; An organisation may use or disclose a government related identifier of an individual if the organisation reasonably believes that the use or disclosure of the identifier is reasonably necessary for one or more enforcement related activities conducted by, or on behalf of, an enforcement body; An organisation may use or disclose a government related identifier of an individual if subclause 9.3 applies in relation to the use or disclosure.  
  disapplies:   
  cross_references: 16A(1); 9.3
