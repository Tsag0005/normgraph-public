---
input_text: |
  26WR(2) (2) The direction must also require the entity to: (a) if it is practicable for the entity to notify the contents of the statement to each of the individuals to whom the relevant information relates - take such steps as are reasonable in the circumstances to notify the contents of the statement to each of the individuals to whom the relevant information relates; or (b) if it is practicable for the entity to notify the contents of the statement to each of the individuals who are at risk from the eligible data breach - take such steps as are reasonable in the circumstances to notify the contents of the statement to each of the individuals who are at risk from the eligible data breach; or (c) if neither paragraph (a) nor (b) applies: (i) publish a copy of the statement on the entity's website (if any); and (ii) take reasonable steps to publicise the contents of the statement. Note: See also subsections 26WF(2) and (5), which deal with remedial action.
raw_completion_output: |-
  provision_id: 26WR(2)

  norms: The direction must require the entity to take reasonable steps to notify the contents of the statement to each individual to whom the relevant information relates if it is practicable for the entity to do so; The direction must require the entity to take reasonable steps to notify the contents of the statement to each individual who is at risk from the eligible data breach if it is practicable for the entity to do so; The direction must require the entity to publish a copy of the statement on the entity's website and take reasonable steps to publicise the contents of the statement if neither it is practicable to notify each of the individuals to whom the relevant information relates nor it is practicable to notify each of the individuals who are at risk from the eligible data breach.

  disapplies: 

  cross_references: 26WF(2); 26WF(5)
