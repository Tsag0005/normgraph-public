provision_id: 26WE(1)
norms:
- deontic_modality: APPLICABILITY
  bearer: AUTO:APP%20entity
  action: AUTO:hold
  object: AUTO:personal%20information%20relating%20to%20one%20or%20more%20individuals
  conditions:
  - statement: an APP entity holds personal information relating to one or more individuals
  - statement: The APP entity is required not to do an act, or engage in a practice, that breaches Australian
      Privacy Principle 11.1 in relation to the personal information.
    source_provision: section 15
- deontic_modality: APPLICABILITY
  bearer: AUTO:credit%20reporting%20body
  action: AUTO:holds
  object: AUTO:credit%20reporting%20information%20relating%20to%20one%20or%20more%20individuals
  conditions:
  - statement: a credit reporting body holds credit reporting information
  - statement: The credit reporting body is required to comply with section 20Q in relation to the credit
      reporting information.
    source_provision: 20Q
- deontic_modality: APPLICABILITY
  bearer: AUTO:credit%20provider
  action: AUTO:applies
  object: AUTO:credit%20eligibility%20information
  conditions:
  - statement: both a credit provider holds credit eligibility information relating to one or more individuals
  - statement: The credit provider is required to comply with subsection 21S(1) in relation to the credit
      eligibility information.
    source_provision: 21S(1)
- deontic_modality: APPLICABILITY
  bearer: AUTO:file%20number%20recipient
  action: AUTO:holds
  object: AUTO:tax%20file%20number%20information%20relating%20to%20one%20or%20more%20individuals
  conditions:
  - statement: A file number recipient holds tax file number information.
  - statement: The file number recipient is required not to do an act, or engage in a practice, that breaches
      a section 17 rule that relates to the tax file number information.
    source_provision: '18'
