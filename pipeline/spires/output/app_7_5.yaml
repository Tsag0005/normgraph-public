  7.5 Despite subclause 7.1, an organisation may use or disclose personal information for the purpose of direct marketing if: (a) the organisation is a contracted service provider for a Commonwealth contract; and (b) the organisation collected the information for the purpose of meeting (directly or indirectly) an obligation under the contract; and (c) the use or disclosure is necessary to meet (directly or indirectly) such an obligation. Individual may request not to receive direct marketing communications etc.
