  26WM Exception - eligible data breaches of other entities If: (a) an entity complies with sections 26WK and 26WL in relation to an eligible data breach of the entity; and (b) the access, disclosure or loss that constituted the eligible data breach of the entity is an eligible data breach of one or more other entities; those sections do not apply in relation to those eligible data breaches of those other entities.
