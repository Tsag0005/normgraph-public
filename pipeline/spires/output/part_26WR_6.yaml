input_text: |
  26WR(6) (6) In deciding whether to give a direction to an entity under subsection (1), the Commissioner must have regard to the following: (a) any relevant advice given to the Commissioner by: (i) an enforcement body; or (ii) the Australian Signals Directorate; (b) any relevant submission that was made by the entity: (i) in response to an invitation under subsection (3); and (ii) within the period specified in the invitation; (c) such other matters (if any) as the Commissioner considers relevant.
