input_text: |
  26WU(5) (5) If documents are produced to the Commissioner in accordance with a requirement under subsection (3), the Commissioner: (a) may take possession of, and may make copies of, or take extracts from, the documents; and (b) may retain possession of the documents for any period that is necessary for the purposes of assessing an entity's compliance with this Part; and (c) during that period must permit a person who would be entitled to inspect any one or more of the documents if they were not in the Commissioner's possession to inspect at all reasonable times any of the documents that the person would be so entitled to inspect.
