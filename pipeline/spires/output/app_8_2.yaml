rnational agreement relating to information sharing to which Australia is a party; Subclause 8.1 does not apply to the disclosure of personal information about an individual by an APP entity to the overseas recipient if the entity is an agency and both of the following apply: the entity reasonably believes that the disclosure of the information is reasonably necessary for one or more enforcement related activities conducted by, or on behalf of, an enforcement body and the recipient is a body that performs functions, or exercises powers, that are similar to those performed or exercised by an enforcement body.  
  disapplies: 8.1  
  cross_references: 8.1; 8.3; section 16A; subsection 16A(1)  
