  9.3 This subclause applies in relation to the adoption, use or disclosure by an organisation of a government related identifier of an individual if: (a) the identifier is prescribed by the regulations; and (b) the organisation is prescribed by the regulations, or is included in a class of organisations prescribed by the regulations; and (c) the adoption, use or disclosure occurs in the circumstances prescribed by the regulations. Note: There are prerequisites that must be satisfied before the matters mentioned in this subclause are prescribed, see subsections 100(2) and (3).
