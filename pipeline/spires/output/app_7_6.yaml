input_text: |
  7.6 If an organisation (the first organisation) uses or discloses personal information about an individual: (a) for the purpose of direct marketing by the first organisation; or (b) for the purpose of facilitating direct marketing by other organisations; the individual may: (c) if paragraph (a) applies - request not to receive direct marketing communications from the first organisation; and (d) if paragraph (b) applies - request the organisation not to use or disclose the information for the purpose referred to in that paragraph; and (e) request the first organisation to provide its source of the information.
raw_completion_output: |-
  provision_id: 7.6  
  norms: If an organisation uses or discloses personal information about an individual for the purpose of direct marketing by the organisation, the individual may request not to receive direct marketing communications from the organisation; If an organisation uses or discloses personal information about an individual for the purpose of facilitating direct marketing by other organisations, the individual may request the organisation not to use or disclose the information for that purpose; An individual may request the first organisation to provide its source of the information.  
  disapplies:   
  cross_references:   
