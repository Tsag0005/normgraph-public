  26WU(3) (3) The Commissioner may give to the person or entity a written notice requiring the person or entity: (a) to give information of the kind specified in the notice to the Commissioner that relates to the matter; or (b) to produce documents of the kind specified in the notice to the Commissioner that relate to the matter; or (c) answer questions of the kind specified in the notice to the Commissioner that relate to the matter. Note: For a failure to give information etc., see section 66.
