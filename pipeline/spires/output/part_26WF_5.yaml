---
input_text: |
  26WF(5) (5) If: (a) a loss of information is covered by paragraph 26WE(2)(b); and (b) the APP entity, credit reporting body, credit provider or file number recipient, as the case may be, takes action in relation to the loss; and (c) the APP entity, credit reporting body, credit provider or file number recipient, as the case may be, does so: (i) after there is unauthorised access to, or unauthorised disclosure of, the information; and (ii) before the access or disclosure results in serious harm to a particular individual to whom the information relates; and (d) as a result of the action, a reasonable person would conclude that the access or disclosure would not be likely to result in serious harm to the individual; this Part does not require: (e) the APP entity, credit reporting body, credit provider or file number recipient, as the case may be; or (f) any other entity; to take steps to notify the individual of the contents of a statement that relates to the loss.
raw_completion_output: |-
  provision_id: 26WF(5)

  norms: This Part does not require the APP entity, credit reporting body, credit provider or file number recipient, as the case may be, to take steps to notify the individual of the contents of a statement that relates to the loss if a loss of information is covered by paragraph 26WE(2)(b), the entity takes action in relation to the loss after there is unauthorised access to, or unauthorised disclosure of, the information and before the access or disclosure results in serious harm, and a reasonable person would conclude that the access or disclosure would not be likely to result in serious harm; This Part does not require any other entity to take steps to notify the individual of the contents of a statement that relates to the loss if a loss of information is covered by paragraph 26WE(2)(b), the entity takes action in relation to the loss after there is unauthorised access to, or unauthorised disclosure of, the information and before the access or disclosure results in serious harm, and a reasonable person would conclude that the access or disclosure would not be likely to result in serious harm.

  disapplies: 

  cross_references: 26WE(2)(b)
