---
input_text: |
  26WE(2) (2) For the purposes of this Act, if: (a) both of the following conditions are satisfied: (i) there is unauthorised access to, or unauthorised disclosure of, the information; (ii) a reasonable person would conclude that the access or disclosure would be likely to result in serious harm to any of the individuals to whom the information relates; or (b) the information is lost in circumstances where: (i) unauthorised access to, or unauthorised disclosure of, the information is likely to occur; and (ii) assuming that unauthorised access to, or unauthorised disclosure of, the information were to occur, a reasonable person would conclude that the access or disclosure would be likely to result in serious harm to any of the individuals to whom the information relates; then: (c) the access or disclosure covered by paragraph (a), or the loss covered by paragraph (b), is an eligible data breach of the APP entity, credit reporting body, credit provider or file number recipient, as the case may be; and (d) an individual covered by subparagraph (a)(ii) or (b)(ii) is at risk from the eligible data breach.
raw_completion_output: |-
  provision_id: 26WE(2)

  norms: For the purposes of this Act, if there is unauthorized access to, or unauthorized disclosure of, the information and a reasonable person would conclude that the access or disclosure would be likely to result in serious harm to any of the individuals to whom the information relates, the access or disclosure is an eligible data breach of the APP entity, credit reporting body, credit provider or file number recipient, as the case may be; For the purposes of this Act, if the information is lost in circumstances where unauthorized access to, or unauthorized disclosure of, the information is likely to occur and assuming that unauthorized access to, or unauthorized disclosure of, the information were to occur, a reasonable person would conclude that the access or disclosure would be likely to result in serious harm to any of the individuals to whom the information relates, the loss is an eligible data breach of the APP entity, credit reporting body, credit provider or file number recipient, as the case may be; For the purposes of this Act, an individual covered by the scenario where there is unauthorized access to, or unauthorized disclosure of, the information resulting in likely serious harm or the scenario where information is lost with likely resulting unauthorized access or disclosure and likely resulting serious harm is at risk from the eligible data breach.

  disapplies: 

  cross_references: 
