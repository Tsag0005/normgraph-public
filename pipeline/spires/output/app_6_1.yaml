---
input_text: |
  6.1 If an APP entity holds personal information about an individual that was collected for a particular purpose (the primary purpose), the entity must not use or disclose the information for another purpose (the secondary purpose) unless: (a) the individual has consented to the use or disclosure of the information; or (b) subclause 6.2 or 6.3 applies in relation to the use or disclosure of the information. Note: Australian Privacy Principle 8 sets out requirements for the disclosure of personal information to a person who is not in Australia or an external Territory.
raw_completion_output: |-
  provision_id: 6.1  
  norms: The entity must not use or disclose the information for a secondary purpose unless the individual has consented to the use or disclosure of the information; The entity must not use or disclose the information for a secondary purpose unless subclause 6.2 or 6.3 applies in relation to the use or disclosure of the information.  
  disapplies:  
  cross_references: 6.2; 6.3; Australian Privacy Principle 8  
prompt: |+
  From the text below, extract the following entities in the following format:

  statement: <The exception in a single clause, as stated in the text.>
  source_provision: <The identifier of the provision that supplies this exception, e.g. "6.2" or "6.2(b)". Blank when the exception is stated here in full.>
  is_exhaustive: <"true" if the text signals these are the only exceptions, otherwise blank.>


  Text:
  subclause 6.2 or 6.3 applies in relation to the use or disclosure of the information

  ===

